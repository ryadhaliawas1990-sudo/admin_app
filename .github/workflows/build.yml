cat << 'EOF' > .github/workflows/build.yml
name: Flutter Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. سحب الكود من المستودع
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. تثبيت جافا (مهمة لبناء الأندرويد)
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    # 3. تثبيت الفلاتر سحابياً
    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.x'
        channel: 'stable'
        cache: true

    # 4. تحميل المكتبات المتواجدة في pubspec.yaml
    - name: Install dependencies
      run: flutter pub get

    # 5. بناء ملف الـ APK
    - name: Build APK
      run: flutter build apk --debug

    # 6. رفع ملف الـ APK الناتج والمحدث بالمليمتر بدون مسافات خاطئة
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: admin-app-debug-apk
        path: build/app/outputs/flutter-apk/app-debug.apk
EOF
